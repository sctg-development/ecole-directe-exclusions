name: Build Mobile Apps

on:
  push:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: build-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build -w @exclusions/client

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 8512546

      - name: Sync Capacitor (Android)
        working-directory: apps/client
        run: npx cap sync android

      - name: Build Android APK
        working-directory: apps/client
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Rename APK with version
        working-directory: apps/client
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="$(node -p "require('./package.json').version")-preview-$(date +'%Y%m%d%H%M%S')"
          fi
          mv android/app/build/outputs/apk/release/app-release.apk "app-release-${VERSION}.apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-app
          path: apps/client/android/app/build/outputs/apk/release/app-release-*.apk

  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build -w @exclusions/client

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Sync Capacitor (iOS)
        working-directory: apps/client
        run: npx cap sync ios

      - name: Build iOS IPA (Release)
        working-directory: apps/client
        run: |
          cd ios/App
          pod install
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath $PWD/build/App.xcarchive \
            archive
          xcodebuild \
            -archivePath $PWD/build/App.xcarchive \
            -exportArchive \
            -exportPath $PWD/build \
            -exportOptionsPlist ExportOptions.plist

      - name: Rename IPA with version
        working-directory: apps/client
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="$(node -p "require('./package.json').version")-preview-$(date +'%Y%m%d%H%M%S')"
          fi
          mv ios/App/build/App.ipa "App-${VERSION}.ipa"

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: apps/client/ios/App/build/App-*.ipa