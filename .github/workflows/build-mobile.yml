name: Build Mobile Apps

on:
  push:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: build-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build -w @exclusions/client

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 8512546

      - name: Sync Capacitor (Android)
        working-directory: apps/client
        run: npx cap sync android

      - name: Build Android APK
        working-directory: apps/client
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Rename APK with version
        working-directory: apps/client
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="$(node -p "require('./package.json').version")-preview-$(date +'%Y%m%d%H%M%S')"
          fi
          # Unsigned build: no release signingConfig is configured yet, so Gradle names the
          # output app-release-unsigned.apk. Not installable on most devices / not Play
          # Store-ready until a real signingConfig + keystore secrets are added.
          mv android/app/build/outputs/apk/release/app-release-unsigned.apk "app-release-${VERSION}-unsigned.apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-app
          path: apps/client/android/app/build/outputs/apk/release/app-release-*-unsigned.apk

  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build -w @exclusions/client

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Sync Capacitor (iOS)
        working-directory: apps/client
        run: npx cap sync ios

      # --- NEW: Install Apple Certificates ---
      - name: Install Apple Certificate
        working-directory: apps/client/ios/App
        env:
          KEYCHAIN_PATH: /Users/runner/build.keychain-db
        run: |
          # Create necessary directories
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles/

          # Create a dedicated, unlocked keychain for this build. Using `security list-keychains
          # -s` with no keychain path (as before) wipes the search list to empty, which is why
          # codesign could never find the imported certificate.
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          # Decode and install the certificate, granting codesign access without a prompt
          echo "${{ secrets.APPLE_CERTIFICATE }}" | base64 --decode > certificate.p12
          security import certificate.p12 -k "$KEYCHAIN_PATH" -P "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Diagnostic: list what identity/team was actually imported (no secrets exposed)
          echo "--- Identities in $KEYCHAIN_PATH ---"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          # Decode and install the provisioning profile
          echo "${{ secrets.APPLE_PROVISIONING_PROFILE }}" | base64 --decode > App_Profile.mobileprovision
          mv App_Profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

          # Create ExportOptions.plist
          cat > ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>6G4W4D2F29</string>
              <key>uploadBitcode</key>
              <false/>
              <key>compileBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>org.eu.sctg-development.exclusions</key>
                  <string>Exclusion AppStore</string>
              </dict>
          </dict>
          </plist>
          EOF

      # --- Build and Archive ---
      - name: Build iOS IPA (Release)
        working-directory: apps/client/ios/App
        run: |
          # Clean previous build
          rm -rf build/

          # Resolve Swift Package Manager dependencies (this project has no Podfile/CocoaPods)
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App

          # Build and archive (manual signing: CI has no Apple ID session for automatic signing,
          # only the certificate/profile installed above)
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath $PWD/build/App.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=6G4W4D2F29 \
            PROVISIONING_PROFILE_SPECIFIER="Exclusion AppStore" \
            archive

          # Export IPA
          xcodebuild \
            -archivePath $PWD/build/App.xcarchive \
            -exportArchive \
            -exportPath $PWD/build \
            -exportOptionsPlist ExportOptions.plist

      # --- Rename and Upload ---
      # Notarization is a macOS Gatekeeper mechanism and doesn't apply to iOS IPAs; app-store
      # builds are reviewed by Apple after upload, not notarized. The IPA is uploaded below as a
      # CI artifact — push it to App Store Connect manually (Transporter) or via TestFlight.
      - name: Rename IPA with version
        working-directory: apps/client/ios/App
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="$(node -p \"require('../../package.json').version\")-preview-$(date +'%Y%m%d%H%M%S')"
          fi
          mv build/App.ipa "App-${VERSION}.ipa"

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: apps/client/ios/App/App-*.ipa

  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute release metadata
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            PKG_VERSION="$(jq -r .version apps/client/package.json)"
            echo "tag=${PKG_VERSION}-preview-$(date +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-app
          path: artifacts/android

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-app
          path: artifacts/ios

      - name: Rename release assets
        run: |
          mkdir -p release-assets
          cp artifacts/android/app-release-*-unsigned.apk "release-assets/exclusions-${{ steps.meta.outputs.tag }}.apk"
          cp artifacts/ios/App-*.ipa "release-assets/exclusions-${{ steps.meta.outputs.tag }}.ipa"

      # New tag on push: create a prerelease. `release: published` already has its own tag,
      # title and notes (set by whoever published it) — only attach assets, don't touch them.
      - name: Publish preview release
        if: github.event_name != 'release'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          files: release-assets/*

      - name: Attach assets to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: release-assets/*
