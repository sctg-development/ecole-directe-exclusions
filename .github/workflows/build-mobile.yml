name: Build Mobile Apps

on:
  push:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: build-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build -w @exclusions/client

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 8512546

      - name: Sync Capacitor (Android)
        working-directory: apps/client
        run: npx cap sync android

      - name: Build Android APK
        working-directory: apps/client
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Rename APK with version
        working-directory: apps/client
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="$(node -p "require('./package.json').version")-preview-$(date +'%Y%m%d%H%M%S')"
          fi
          mv android/app/build/outputs/apk/release/app-release.apk "app-release-${VERSION}.apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-app
          path: apps/client/android/app/build/outputs/apk/release/app-release-*.apk

build-ios:
  name: Build iOS App
  runs-on: macos-latest
  steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Build web app
      run: npm run build -w @exclusions/client

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest

    - name: Install CocoaPods
      run: |
        sudo gem install cocoapods
        sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
        echo "$HOME/.gem/ruby/3.1.0/bin" >> $GITHUB_PATH

    - name: Sync Capacitor (iOS)
      working-directory: apps/client
      run: npx cap sync ios

    # --- NEW: Install Apple Certificates ---
    - name: Install Apple Certificate
      working-directory: apps/client/ios/App
      run: |
        # Create necessary directories
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles/
        mkdir -p ~/Library/Keychains/

        # Decode and install the certificate
        echo "${{ secrets.APPLE_CERTIFICATE }}" | base64 --decode > certificate.p12
        security import certificate.p12 -P "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" -A
        security list-keychain -d user -s

        # Decode and install the provisioning profile
        echo "${{ secrets.APPLE_PROVISIONING_PROFILE }}" | base64 --decode > App_Profile.mobileprovision
        mv App_Profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

        # Create ExportOptions.plist
        cat > ExportOptions.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>DRJUH4K7VV</string>
            <key>uploadBitcode</key>
            <false/>
            <key>compileBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
        </dict>
        </plist>
        EOF

    # --- Build and Archive ---
    - name: Build iOS IPA (Release)
      working-directory: apps/client/ios/App
      run: |
        # Clean previous build
        rm -rf build/

        # Install pods
        pod install --repo-update

        # Build and archive
        xcodebuild \
          -workspace App.xcworkspace \
          -scheme App \
          -configuration Release \
          -destination generic/platform=iOS \
          -archivePath $PWD/build/App.xcarchive \
          archive

        # Export IPA
        xcodebuild \
          -archivePath $PWD/build/App.xcarchive \
          -exportArchive \
          -exportPath $PWD/build \
          -exportOptionsPlist ExportOptions.plist

    # --- Notarization (required for distribution) ---
    - name: Notarize IPA
      working-directory: apps/client/ios/App
      run: |
        # Install altool (notarization tool)
        xcrun altool --notarize-app \
          --primary-bundle-id "org.eu.sctg-development.exclusions" \
          --username "${{ secrets.APPLE_ID }}" \
          --password "${{ secrets.APPLE_ID_PASSWORD }}" \
          --file build/App.ipa

        # Alternative with API Key (recommended)
        # xcrun altool --notarize-app \
        #   --primary-bundle-id "org.eu.sctg-development.exclusions" \
        #   --asc-provider "${{ secrets.APP_STORE_CONNECT_PROVIDER }}" \
        #   --api-key "${{ secrets.APP_STORE_CONNECT_API_KEY }}" \
        #   --file build/App.ipa

        # Wait for notarization (may take several minutes)
        sleep 60

        # Check status
        xcrun altool --notarization-info "${{ secrets.APPLE_ID }}" \
          --password "${{ secrets.APPLE_ID_PASSWORD }}" \
          --primary-bundle-id "org.eu.sctg-development.exclusions"

    # --- Rename and Upload ---
    - name: Rename IPA with version
      working-directory: apps/client/ios/App
      run: |
        if [ "${{ github.event_name }}" = "release" ]; then
          VERSION="${{ github.ref_name }}"
        else
          VERSION="$(node -p \"require('../../package.json').version\")-preview-$(date +'%Y%m%d%H%M%S')"
        fi
        mv build/App.ipa "App-${VERSION}.ipa"

    - name: Upload iOS IPA
      uses: actions/upload-artifact@v4
      with:
        name: ios-app
        path: apps/client/ios/App/App-*.ipa
