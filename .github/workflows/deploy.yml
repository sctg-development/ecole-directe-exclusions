# Deploys ONE school per run. Each school is a fully independent Worker + D1 stack
# (a wrangler environment with its own database and secrets): student data never crosses
# school boundaries, which is a GDPR requirement — so deployments are independent too.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      school:
        description: School to deploy (wrangler environment)
        required: true
        type: choice
        options:
          - apprentis-auteuil
          - saint-dominique
          - saint-paul

# Never run two deployments of the same school at once; queue instead of cancelling.
concurrency:
  group: deploy-${{ inputs.school }}

jobs:
  deploy:
    name: Deploy ${{ inputs.school }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Worker serves the web app as static assets from ../client/dist.
      - name: Build client
        run: npm run build -w @exclusions/client

      - name: Apply D1 migrations
        working-directory: apps/server
        run: npx wrangler d1 migrations apply DB --env ${{ inputs.school }} --remote

      - name: Deploy Worker
        working-directory: apps/server
        run: npx wrangler deploy --env ${{ inputs.school }}
